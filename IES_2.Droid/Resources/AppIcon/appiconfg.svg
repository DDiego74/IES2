<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!--
    Foreground layer for Android adaptive icon (safe zone: central 72dp of 108dp canvas).
    No background fill – the background comes from appicon.svg / Color attribute.
    SVG <text> is not supported in Android Vector Drawable, so we use geometric paths.
    This draws a stylised "I2" using rect shapes (capital I + numeral 2).
  -->

  <!-- Capital "I" (left half of icon) -->
  <!-- Top horizontal bar -->
  <rect x="14" y="32" width="34" height="8" rx="2" fill="white"/>
  <!-- Vertical bar -->
  <rect x="27" y="40" width="8" height="28" rx="1" fill="white"/>
  <!-- Bottom horizontal bar -->
  <rect x="14" y="68" width="34" height="8" rx="2" fill="white"/>

  <!-- Numeral "2" (right half of icon) -->
  <!-- Top arc (approximated as a rounded rect top) -->
  <rect x="60" y="32" width="34" height="8" rx="4" fill="white"/>
  <!-- Upper-right vertical -->
  <rect x="86" y="40" width="8" height="16" rx="1" fill="white"/>
  <!-- Middle horizontal bar -->
  <rect x="60" y="52" width="34" height="7" rx="2" fill="white"/>
  <!-- Lower-left vertical -->
  <rect x="60" y="59" width="8" height="17" rx="1" fill="white"/>
  <!-- Bottom horizontal bar -->
  <rect x="60" y="68" width="34" height="8" rx="4" fill="white"/>
</svg>
